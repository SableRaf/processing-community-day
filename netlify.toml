[build]
  base = "pcd-website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  DEPLOY_TARGET = "netlify"

[[redirects]]
  from = "/_astro/og-image*"
  to = "/og-image.png"
  status = 301

[[redirects]]
  from = "/_astro/PCD2026_og-image_tinyfied*"
  to = "/og-image.png"
  status = 301

[[redirects]]
  from = "/organize/activity-guides/library/*"
  to = "/organize/zines/zine-library/"
  status = 301

[[redirects]]
  from = "/organize/activity-guides/what-are-activity-guides/*"
  to = "/organize/zines/zine-library/"
  status = 301

[[redirects]]
  from = "/organize/activity-guides/what-is-a-guide/*"
  to = "/organize/zines/zine-library/"
  status = 301

[[redirects]]
  from = "/organize/activity-guides/making-a-zine/*"
  to = "/organize/zines/how-to-make-a-zine/"
  status = 301

[[redirects]]
  from = "/organize/activity-guides/*"
  to = "/organize/zines/:splat"
  status = 301

[[headers]]
  for = "/data.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Public Discourse feed, requested by the browser rather than during builds.
[[redirects]]
  from = "/api/pcd-forum"
  to = "https://discourse.processing.org/tag/pcd/l/latest.json?order=activity"
  status = 200
  force = true
