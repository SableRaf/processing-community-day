name: "📚 New Zine"
description: Submit an Activity Guide zine for the PCD Zine Library.
title: "New Zine: "
labels:
  - new zine
  - needs review
body:
  - type: markdown
    attributes:
      value: |
        <!-- new-zine-template -->
        Everything you submit via this form is public. Do not include private or sensitive information.
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of your zine.
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      description: The main focus of your zine.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional comma-separated tags that help describe the zine.
      placeholder: beginner, p5.js, physical computing
  - type: input
    id: creators
    attributes:
      label: Creator(s)
      description: The person or group to credit.
    validations:
      required: true
  - type: input
    id: creator_url
    attributes:
      label: Creator URL
      description: Optional public website for the credited person or group.
      placeholder: https://example.org/
  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: A concise description for the zine for the library card.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Full description
      description: Public description shown on the zine page. Markdown is supported.
    validations:
      required: true
  - type: input
    id: reader_order_pdf
    attributes:
      label: Reader-order PDF URL
      description: Link to a PDF with sequentially ordered pages for reading on a screen.
      placeholder: https://example.org/my-guide-reader-order.pdf
    validations:
      required: true
  - type: input
    id: print_ready_pdf
    attributes:
      label: Print-ready PDF URL
      description: Link to a PDF with pages arranged for printing and folding into a booklet.
      placeholder: https://example.org/my-guide-print-ready.pdf
    validations:
      required: true
  - type: input
    id: activity_type
    attributes:
      label: Activity type
      description: Optional. How is the activity intended to be used? For example, workshop, group discussion, self-guided activity, or creative exercise.
  - type: input
    id: zine_format
    attributes:
      label: Zine format
      description: Optional. How is the zine structured, and what paper size does it use? For example, single-sheet folded zine on A4 / US Letter, multi-sheet booklet, individual pages, or digital-only.
      placeholder: Single-sheet 8-page folded mini-zine on A4
  - type: input
    id: duration
    attributes:
      label: Duration
      description: Optional, for example 45 minutes or 2 hours.
  - type: textarea
    id: materials
    attributes:
      label: Materials
      description: Optional materials participants need.
  - type: input
    id: attribution
    attributes:
      label: Preferred attribution
      description: Optional attribution wording.
  - type: textarea
    id: maintainer_notes
    attributes:
      label: Maintainer notes
      description: Optional notes for maintainers. These notes are public.
  - type: checkboxes
    id: license_consent
    attributes:
      label: License consent
      options:
        - label: I own or have permission to license this material under CC BY-SA 4.0.
          required: true
  - type: checkboxes
    id: link_consent
    attributes:
      label: Public, stable PDF links
      description: Both links must work without login and must not be short-lived or expiring.
      options:
        - label: I confirm both PDF links are publicly accessible without login and are stable, non-expiring links.
          required: true
