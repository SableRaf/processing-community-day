name: "📚 New Zine"
description: Submit an Activity Guide zine for the PCD Zine Library.
title: "New Zine: "
labels:
  - new zine
  - needs review
body:
  - type: markdown
    attributes:
      value: |
        <!-- new-zine-template -->
        Everything you submit via this form is public. Do not include private or sensitive information.
  - type: input
    id: title
    attributes:
      label: Title
      description: The title of your zine.
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      description: The main focus of your zine.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional comma-separated tags that help describe the zine.
      placeholder: beginner, p5.js, physical computing
  - type: input
    id: languages
    attributes:
      label: Language(s)
      description: Optional comma-separated languages used in the zine.
      placeholder: English, Spanish, Chinese
  - type: input
    id: creators
    attributes:
      label: Creator(s)
      description: The person or group to credit.
    validations:
      required: true
  - type: input
    id: creator_url
    attributes:
      label: Creator URL
      description: Optional public website for the credited person or group.
      placeholder: https://example.org/
  - type: textarea
    id: summary
    attributes:
      label: Short summary
      description: A concise description for the zine for the library card.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Full description
      description: Public description shown on the zine page. Markdown is supported.
    validations:
      required: true
  - type: textarea
    id: reader_order_pdf
    attributes:
      label: Reader-order PDF
      description: Upload one PDF with sequentially ordered pages for reading on a screen. Attach the file directly here; external links are not accepted.
      placeholder: Attach one PDF here.
    validations:
      required: true
  - type: textarea
    id: print_ready_pdf
    attributes:
      label: Print-ready PDF
      description: Upload one PDF with pages arranged for printing and folding into a booklet. Attach the file directly here; external links are not accepted.
      placeholder: Attach one PDF here.
    validations:
      required: true
  - type: textarea
    id: cover_image
    attributes:
      label: Cover image
      description: Optional. Attach one PNG, JPG/JPEG, or WebP cover image (10 MB maximum). The zine title is used as its alt text.
      placeholder: Attach one cover image here.
  - type: textarea
    id: additional_files
    attributes:
      label: Additional files
      description: Optional. Attach up to eight extra PDF, ZIP, PNG, JPG/JPEG, WebP, TXT, MD, CSV, or JSON files directly here (seven when also attaching a cover). Files are downloads, not covers. Limits: 25 MB each (10 MB for images), 50 MB total, and 10 files including cover and PDFs.
      placeholder: Attach any additional files here.
  - type: input
    id: activity_type
    attributes:
      label: Activity type
      description: Optional. How is the activity intended to be used? For example, workshop, group discussion, self-guided activity, or creative exercise.
  - type: input
    id: zine_format
    attributes:
      label: Zine format
      description: Optional. How is the zine structured, and what paper size does it use? For example, single-sheet folded zine on A4 / US Letter, multi-sheet booklet, individual pages, or digital-only.
      placeholder: Single-sheet 8-page folded mini-zine on A4
  - type: input
    id: duration
    attributes:
      label: Duration of the activity
      description: Optional, for example 45 minutes or 2 hours.
  - type: textarea
    id: materials
    attributes:
      label: Materials
      description: Optional materials participants need.
  - type: input
    id: attribution
    attributes:
      label: Preferred attribution
      description: Optional attribution wording.
  - type: textarea
    id: maintainer_notes
    attributes:
      label: Maintainer notes
      description: Anything you'd like to tell us about your submission. These notes are public on GitHub but will not be included on the website.
  - type: checkboxes
    id: license_consent
    attributes:
      label: License consent
      options:
        - label: I own or have permission to license this material under CC BY-SA 4.0.
          required: true
